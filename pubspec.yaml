name: scrbbl
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0
  dynamic_color: ^1.7.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  drift_dev: ^2.24.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  riverpod_annotation: ^2.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/db/dictionary.sqlite
